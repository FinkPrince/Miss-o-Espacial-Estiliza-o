<!DOCTYPE html>
<html lang="pt-BR">
<head>
   //CÓDIGO COM TUDO JUNTO PARA VER SE DÁ CERTO OU NÃO (BATEU A PREGUIÇA D SEPARAR, QUALQUER COISA SEPARAMOS DEPOIS PARA FICAR MAIS "CERTINHO")
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Controle Espacial — Acesso</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    header { margin-bottom:32px; }
    .login-wrap { width:100%; max-width:420px; }
    .tabs { display:flex; border-bottom:1px solid var(--borda); }
    .tab {
      flex:1; background:none; border:none; border-bottom:2px solid transparent;
      color:var(--cinza); font-family:monospace; font-size:11px; letter-spacing:2px;
      padding:10px 0 12px; cursor:pointer; text-transform:uppercase; transition:color .2s;
    }
    .tab:hover { color:var(--texto2); }
    .tab.ativo { color:var(--azul); border-bottom-color:var(--azul); }
    .card-login { background:var(--card); border-radius:0 0 4px 4px; padding:28px 28px 32px; }
    .form-section { display:none; }
    .form-section.ativa { display:block; }
    .campo { margin-bottom:16px; }
    .campo label { display:block; font-size:10px; letter-spacing:2px; color:var(--cinza); text-transform:uppercase; margin-bottom:6px; }
    .campo input {
      width:100%; background:#0f1e35; border:1px solid var(--borda); border-radius:3px;
      color:var(--texto); font-family:monospace; font-size:14px; padding:9px 12px; outline:none; transition:border-color .2s;
    }
    .campo input:focus { border-color:var(--azul); }
    .campo input::placeholder { color:#2a4a6a; }
    .pass-wrap { position:relative; }
    .pass-wrap input { padding-right:38px; }
    .olho {
      position:absolute; right:10px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; padding:4px; color:var(--cinza); transition:color .2s; line-height:0;
    }
    .olho:hover { color:var(--azul); }
    .olho svg { width:15px; height:15px; }
    .btn-login { width:100%; margin-top:6px; }
    .msg { font-size:12px; padding:8px 12px; border-radius:3px; margin-top:14px; display:none; }
    .msg.ok   { display:block; color:var(--verde);    border:1px solid var(--verde);    background:rgba(0,255,157,.05); }
    .msg.erro { display:block; color:var(--vermelho); border:1px solid var(--vermelho); background:rgba(255,61,90,.05); }
  </style>
</head>
<body>

<header>
  <h1>🚀 Centro de Controle Espacial</h1>
  <p>Missão Supernova Skywalker !</p>
</header>

<div class="login-wrap">
  <div class="tabs">
    <button class="tab ativo" onclick="trocarTab('login',this)">Entrar</button>
    <button class="tab"       onclick="trocarTab('cadastro',this)">Cadastrar</button>
  </div>
  <div class="card-login">

    <div class="form-section ativa" id="secLogin">
      <div class="campo"><label>Nome de Usuário</label><input type="text" id="l-nome" placeholder="seu_nome" autocomplete="username" /></div>
      <div class="campo"><label>Senha</label>
        <div class="pass-wrap">
          <input type="password" id="l-senha" placeholder="••••••••" autocomplete="current-password" />
          <button class="olho" onclick="verSenha('l-senha',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icone-olho"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn azul btn-login" onclick="doLogin()">Autenticar</button>
      <div class="msg" id="msgLogin"></div>
    </div>

    <div class="form-section" id="secCadastro">
      <div class="campo"><label>Nome de Usuário</label><input type="text" id="c-nome" placeholder="escolha_um_nome" autocomplete="username" /></div>
      <div class="campo"><label>Senha</label>
        <div class="pass-wrap">
          <input type="password" id="c-senha" placeholder="••••••••" autocomplete="new-password" />
          <button class="olho" onclick="verSenha('c-senha',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icone-olho"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="campo"><label>Confirmar Senha</label>
        <div class="pass-wrap">
          <input type="password" id="c-senha2" placeholder="••••••••" autocomplete="new-password" />
          <button class="olho" onclick="verSenha('c-senha2',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icone-olho"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn verde btn-login" onclick="doCadastro()">Criar Conta</button>
      <div class="msg" id="msgCadastro"></div>
    </div>

  </div>
</div>

<div class="space-section">
  <div class="satelite-wrapper">
    <div class="satelite">
      <div class="painel"></div>
      <div class="corpo"><div class="antena"></div><div class="janela"></div><div class="led"></div></div>
      <div class="painel"></div>
    </div>
  </div>
</div>
<div class="estrelas"><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span></div>

<script>
  const API = 'http://localhost:8080';
  const $ = id => document.getElementById(id);

  // Se já estiver logado, vai direto pro sistema
  if (localStorage.getItem('esp_session')) window.location.href = 'index.html';

  function trocarTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
    btn.classList.add('ativo');
    $('secLogin').classList.toggle('ativa', tab === 'login');
    $('secCadastro').classList.toggle('ativa', tab === 'cadastro');
    limparMsgs();
  }

  function limparMsgs() {
    ['msgLogin','msgCadastro'].forEach(id => { $(id).className = 'msg'; $(id).textContent = ''; });
  }

  function msg(id, tipo, txt) { $(id).className = 'msg ' + tipo; $(id).textContent = txt; }

  function verSenha(inputId, btn) {
    const inp = $(inputId);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.querySelector('.icone-olho').innerHTML = inp.type === 'text'
      ? '<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

  async function chamarAPI(endpoint, body) {
    const res = await fetch(`${API}${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return { ok: res.ok, data: await res.json() };
  }

  async function doLogin() {
    const nome = $('l-nome').value.trim(), senha = $('l-senha').value;
    if (!nome || !senha) return msg('msgLogin','erro','Preencha todos os campos.');
    try {
      const { ok, data } = await chamarAPI('/auth/login', { nome, senha });
      if (ok) { localStorage.setItem('esp_session', data.usuario); window.location.href = 'index.html'; }
      else msg('msgLogin','erro', data.erro);
    } catch { msg('msgLogin','erro','Não foi possível conectar ao servidor.'); }
  }

  async function doCadastro() {
    const nome = $('c-nome').value.trim(), senha = $('c-senha').value, senha2 = $('c-senha2').value;
    if (!nome || !senha || !senha2) return msg('msgCadastro','erro','Preencha todos os campos.');
    if (nome.length < 3)  return msg('msgCadastro','erro','Nome precisa ter ao menos 3 caracteres.');
    if (senha.length < 4) return msg('msgCadastro','erro','Senha precisa ter ao menos 4 caracteres.');
    if (senha !== senha2) return msg('msgCadastro','erro','As senhas não coincidem.');
    try {
      const { ok, data } = await chamarAPI('/auth/cadastrar', { nome, senha });
      if (ok) {
        msg('msgCadastro','ok', data.mensagem + ' Entrando...');
        setTimeout(() => { localStorage.setItem('esp_session', nome); window.location.href = 'index.html'; }, 1200);
      } else msg('msgCadastro','erro', data.erro);
    } catch { msg('msgCadastro','erro','Não foi possível conectar ao servidor.'); }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') $('secLogin').classList.contains('ativa') ? doLogin() : doCadastro();
  });
</script>
</body>
</html>
